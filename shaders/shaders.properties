# GTNH Gentle Atmosphere 0.7.0 - https://github.com/CptBomba/Shader-GTNH-Gentle-Atomosphere
clouds=fancy
oldLighting=true
oldHandLight=true
dynamicHandLight=true
sun=true
moon=true
underwaterOverlay=true
shadowTerrain=true
shadowTranslucent=false
shadowEntities=true
shadowPlayer=true
shadowBlockEntities=true
# All targets stay full size: beta66b rounds half-size targets to zero at 1 px.
size.buffer.colortex2=1.0 1.0
size.buffer.colortex3=1.0 1.0
# Optional, experimental: the Gentle Lights companion mod publishes its light
# grid through this sampler. Only requested when local light shadows are on;
# without the mod the header check fails and the vanilla lightmap is kept.
#if LOCAL_LIGHT_SHADOWS > 0
texture.gbuffers.noisetex=gtnhgentlelights:lightgrid
#endif
# Preserve the original alpha tests and blend modes for special mod renderers.

profile.Minimal=VEGETATION_SWAY:1 WIND_STRENGTH:0.40 MOD_LEAVES:1 MOD_FLOWERS:1 FOLIAGE_FILTER:1 CLOUD_QUALITY:1 CLOUD_STYLE:1 CLOUD_COVERAGE:0.35 CLOUD_HEIGHT:168 CLOUD_SPEED:0.5 SKY_STRENGTH:0.55 COLOR_STRENGTH:0.35 SHADE_SOFTNESS:0.08 SUNLIGHT_STRENGTH:0.40 SHADOWS:0 SHADOW_SOFTNESS:1.0 SHADOW_BIAS:1.0 LOCAL_LIGHT_SHADOWS:0 BLOCKLIGHT_WARMTH:0.30 TORCH_FLICKER:0 HANDHELD_LIGHT:1 WATER_EFFECT:0 WATER_STRENGTH:0.35 WATER_REFLECTIONS:0 WATER_TEXTURE:1.0 ANTIALIASING:1 SHARPNESS:0.20 BLOOM_STRENGTH:0.0 HIGHLIGHT_COMPRESSION:0.25 FOG_STRENGTH:1.0 EARTH_EFFECTS:1
profile.Natural=VEGETATION_SWAY:1 WIND_STRENGTH:0.75 MOD_LEAVES:1 MOD_FLOWERS:1 FOLIAGE_FILTER:1 CLOUD_QUALITY:2 CLOUD_STYLE:1 CLOUD_COVERAGE:0.65 CLOUD_HEIGHT:168 CLOUD_SPEED:1.0 SKY_STRENGTH:0.75 COLOR_STRENGTH:0.55 SHADE_SOFTNESS:0.15 SUNLIGHT_STRENGTH:0.80 SHADOWS:1 SHADOW_SOFTNESS:1.0 SHADOW_BIAS:1.0 LOCAL_LIGHT_SHADOWS:0 BLOCKLIGHT_WARMTH:0.60 TORCH_FLICKER:1 HANDHELD_LIGHT:1 WATER_EFFECT:1 WATER_STRENGTH:0.65 WATER_REFLECTIONS:1 WATER_TEXTURE:0.50 ANTIALIASING:1 SHARPNESS:0.35 BLOOM_STRENGTH:0.06 HIGHLIGHT_COMPRESSION:0.25 FOG_STRENGTH:1.1 EARTH_EFFECTS:1
profile.Atmospheric=VEGETATION_SWAY:1 WIND_STRENGTH:1.0 MOD_LEAVES:1 MOD_FLOWERS:1 FOLIAGE_FILTER:1 CLOUD_QUALITY:3 CLOUD_STYLE:1 CLOUD_COVERAGE:0.65 CLOUD_HEIGHT:168 CLOUD_SPEED:1.0 SKY_STRENGTH:1.0 COLOR_STRENGTH:0.75 SHADE_SOFTNESS:0.22 SUNLIGHT_STRENGTH:1.0 SHADOWS:1 SHADOW_SOFTNESS:1.4 SHADOW_BIAS:1.0 LOCAL_LIGHT_SHADOWS:0 BLOCKLIGHT_WARMTH:0.90 TORCH_FLICKER:1 HANDHELD_LIGHT:1 WATER_EFFECT:1 WATER_STRENGTH:1.0 WATER_REFLECTIONS:2 WATER_TEXTURE:0.25 ANTIALIASING:1 SHARPNESS:0.35 BLOOM_STRENGTH:0.04 HIGHLIGHT_COMPRESSION:0.40 FOG_STRENGTH:1.2 EARTH_EFFECTS:1

screen=<profile> [CLOUDS] [VEGETATION] [LIGHTING] [BLOCKLIGHT] [WATER] [IMAGE] [COMPATIBILITY]
screen.columns=2
screen.CLOUDS=CLOUD_STYLE CLOUD_QUALITY CLOUD_COVERAGE CLOUD_HEIGHT CLOUD_SPEED
screen.VEGETATION=VEGETATION_SWAY WIND_STRENGTH MOD_LEAVES MOD_FLOWERS FOLIAGE_FILTER
screen.LIGHTING=SUNLIGHT_STRENGTH SHADOWS SHADOW_SOFTNESS SHADOW_BIAS SKY_STRENGTH COLOR_STRENGTH SHADE_SOFTNESS FOG_STRENGTH
screen.BLOCKLIGHT=BLOCKLIGHT_WARMTH TORCH_FLICKER HANDHELD_LIGHT LOCAL_LIGHT_SHADOWS
screen.WATER=WATER_EFFECT WATER_STRENGTH WATER_REFLECTIONS WATER_TEXTURE
screen.IMAGE=ANTIALIASING SHARPNESS BLOOM_STRENGTH HIGHLIGHT_COMPRESSION
screen.COMPATIBILITY=EARTH_EFFECTS
sliders=BLOCKLIGHT_WARMTH WIND_STRENGTH CLOUD_SPEED CLOUD_COVERAGE SUNLIGHT_STRENGTH SHADOW_SOFTNESS SHADOW_BIAS WATER_STRENGTH WATER_TEXTURE SKY_STRENGTH COLOR_STRENGTH SHADE_SOFTNESS FOG_STRENGTH SHARPNESS BLOOM_STRENGTH HIGHLIGHT_COMPRESSION
