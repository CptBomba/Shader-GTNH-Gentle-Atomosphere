# Material IDs, NOT Minecraft registry IDs. No industrial blocks are mapped.
# beta66b ignores metadata: do not use mixed plant/machine block registrations.
# 'leaves' without minecraft: bypasses Angelica's automatic treeLeaves expansion.
#if MOD_LEAVES == 1
# Enabled by default: Angelica expands only blocks in the treeLeaves dictionary.
block.10001=minecraft:leaves minecraft:leaves2
#else
block.10001=leaves leaves2
#endif
#if MOD_FLOWERS == 1
# Verified in Botania-1.12.28-GTNH.jar: flower is the dedicated BlockModFlower
# registration; all its metadata are flowers. No special/double/floating flowers.
# Biomes O' Plenty flowers/flowers2/foliage hold only single-block plants;
# its "plants" block mixes stacked canes and roots and stays static.
block.10002=minecraft:tallgrass minecraft:sapling minecraft:red_flower minecraft:yellow_flower minecraft:deadbush Botania:flower BiomesOPlenty:flowers BiomesOPlenty:flowers2 BiomesOPlenty:foliage
#else
block.10002=minecraft:tallgrass minecraft:sapling minecraft:red_flower minecraft:yellow_flower minecraft:deadbush
#endif
block.10003=minecraft:wheat minecraft:carrots minecraft:potatoes
block.10004=minecraft:water minecraft:flowing_water
block.10005=minecraft:waterlily
# Light sources whose bright, warm texels (flames, glowing faces) get a halo.
# Only those texels glow: torch sticks, furnace stone and lamp frames do not.
block.10006=minecraft:torch minecraft:redstone_torch minecraft:fire minecraft:glowstone minecraft:lit_redstone_lamp minecraft:lit_furnace TConstruct:decoration.stonetorch
block.10007=minecraft:lava minecraft:flowing_lava
# Double plants, vines, IC2 crops, trunks, mod fluids and unknown blocks stay static.
