name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Compile every program with every profile
        run: python3 tools/validate.py

      - name: Package
        run: python3 tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: GTNH-Gentle-Atmosphere
          path: dist/*.zip

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release_notes.py > dist/RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: GTNH Gentle Atmosphere ${{ github.ref_name }}
          files: dist/*.zip
          body_path: dist/RELEASE_NOTES.md
