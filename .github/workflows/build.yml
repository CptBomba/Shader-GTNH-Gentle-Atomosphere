name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Manual "Run workflow" on main publishes the release for VERSION,
  # creating the vX.Y.Z tag on that commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install glslangValidator
        run: sudo apt-get update && sudo apt-get install -y glslang-tools

      - name: Compile every program with every profile
        run: python3 tools/validate.py

      - name: Package
        run: python3 tools/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: GTNH-Gentle-Atmosphere
          path: dist/*.zip

      - name: Release version
        id: version
        run: echo "tag=v$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "$GITHUB_REF_NAME" = "${{ steps.version.outputs.tag }}"

      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: python3 tools/release_notes.py > dist/RELEASE_NOTES.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GTNH Gentle Atmosphere ${{ steps.version.outputs.tag }}
          files: dist/*.zip
          body_path: dist/RELEASE_NOTES.md
